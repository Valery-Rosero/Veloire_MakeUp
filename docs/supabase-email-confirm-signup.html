<div style="background:#faf6f3;padding:48px 24px;font-family:Arial,sans-serif;">
  <div style="max-width:520px;margin:0 auto;">

    <!-- Logo -->
    <div style="text-align:center;margin-bottom:28px;">
      <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:30px;letter-spacing:2px;color:#1a1a1a;font-style:italic;">Vèloire</p>
      <p style="margin:6px 0 0;font-size:9px;letter-spacing:5px;color:#a56583;text-transform:uppercase;">MAKE UP</p>
    </div>

    <!-- Separador -->
    <div style="height:1px;background:linear-gradient(90deg,transparent,#e8d0c0,transparent);margin-bottom:36px;"></div>

    <!-- Cuerpo -->
    <div style="background:#ffffff;border:1px solid #e8d0c0;border-radius:16px;padding:40px 36px;text-align:center;">

      <p style="margin:0 0 14px;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#a56583;">Confirma tu cuenta</p>

      <h1 style="margin:0 0 18px;font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:normal;font-style:italic;color:#1a1a1a;line-height:1.35;">
        Ya casi estás en Vèloire
      </h1>

      <p style="margin:0 0 32px;font-size:14px;color:#6b4f5a;line-height:1.75;">
        Confirma tu correo para empezar a explorar nuestra colección de maquillaje hecho para quienes crean.
      </p>

      <!-- Botón -->
      <a href="{{ .ConfirmationURL }}"
         style="display:inline-block;background:#1a1a1a;color:#f5e1d3;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;text-decoration:none;padding:15px 40px;border-radius:10px;">
        Confirmar mi correo
      </a>

      <p style="margin:28px 0 0;font-size:12px;color:#b09090;line-height:1.6;">
        Si no creaste esta cuenta, puedes ignorar este mensaje sin problema.
      </p>

    </div>

    <!-- Footer -->
    <div style="height:1px;background:linear-gradient(90deg,transparent,#e8d0c0,transparent);margin:32px 0 20px;"></div>
    <p style="text-align:center;margin:0;font-size:11px;color:#b09090;letter-spacing:1px;">
      Vèloire MakeUp &nbsp;·&nbsp; Pasto, Nariño
    </p>

  </div>
</div>
